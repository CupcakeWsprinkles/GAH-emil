<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Bubbly Font von Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100dvh;
      background-color: #5c0a1e; /* Weinrot */
      font-family: 'Fredoka', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    /* Computer-Fenster Design */
    .window {
      background-color: #0d0d0d; /* Schwarz */
      border: 3px solid #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Obere Fensterleiste */
    .title-bar {
      background-color: #1f1f1f;
      border-bottom: 2px solid #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      display: inline-block;
    }

    .window-body {
      padding: 26px 22px;
      text-align: center;
    }

    .story-text {
      font-size: 1.45rem;
      line-height: 1.45;
      margin: 0 0 24px 0;
      word-wrap: break-word;
    }

    /* Kleinerer Text für den langen Geburtstagstext am Ende */
    .story-text.long-text {
      font-size: 1.15rem;
      line-height: 1.6;
      text-align: left;
    }

    /* Button Container */
    .options-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    /* Umrahmte Kästen (Buttons) */
    .option-btn {
      background-color: #000000;
      color: #ffffff;
      border: 2.5px solid #ffffff;
      border-radius: 10px;
      padding: 12px 18px;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, color 0.15s ease;
      flex: 1 1 auto;
      min-width: 120px;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #ffffff;
      color: #000000;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    /* Nicht anklickbare Optionen */
    .option-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      border-style: dashed;
    }

    /* GIF Bereich für Schritt 1,21 */
    .gif-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .gif-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .gif-row img {
      max-width: 240px;
      max-height: 240px;
      border: 2.5px solid #ffffff;
      border-radius: 10px;
      display: block;
    }

    .small-box-btn {
      background-color: #000000;
      color: #ffffff;
      border: 2.5px solid #ffffff;
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
    }

    .small-box-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="window" id="windowBox">
    <div class="title-bar">

      <div class="window-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    <div class="window-body" id="windowContent">

    function renderScene(sceneKey) {
      const scene = scenes[sceneKey];
      const container = document.getElementById("windowContent");
      const windowBox = document.getElementById("windowBox");

      // Animation neu triggern
      windowBox.style.animation = "none";
      windowBox.offsetHeight;
      windowBox.style.animation = null;

      container.innerHTML = "";

      // Spezialansicht für das GIF in 1,21
      if (scene.isGifScene) {
        const wrapper = document.createElement("div");
        wrapper.className = "gif-wrapper";

        const row = document.createElement("div");
        row.className = "gif-row";

        const img = document.createElement("img");
        img.src = scene.gifUrl;
        img.alt = "Surprise GIF";

        const btn = document.createElement("button");
        btn.className = "small-box-btn";
        btn.textContent = "?!?!";
        btn.onclick = () => renderScene(scene.next);

        row.appendChild(img);
        row.appendChild(btn);
        wrapper.appendChild(row);
        container.appendChild(wrapper);
        return;
      }

      // Normaler Text
      const p = document.createElement("p");
      p.className = scene.isLong ? "story-text long-text" : "story-text";
      p.textContent = scene.text;
      container.appendChild(p);

      // Optionen rendern
      const opts = scene.getOptions ? scene.getOptions() : scene.options;
      if (opts && opts.length > 0) {
